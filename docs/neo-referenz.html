<title>NEO-Kickoff</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: Kopfleiste mit Navigation (dunkleres Band) · darunter Detailansicht (Spiele/Teams) | Marktchancen */
/* Farben (Neo-Referenz, 26.10.2026): Inhalte und Darstellungsformen wie NEO-Kickoff, nur die Farbwerte neu.
   Dunkel ist der Standard und auf Lesbarkeit gestimmt: Flächen neutral-warm (Graphit) statt blaugrau,
   Text gebrochenes Weiß (rund 14:1), Nebentext rund 7:1 auf --surface. Blau bleibt nur als Akzent und als
   Farbe der Heimmannschaft, wie in der Referenz. */
:root{
  --bg:#131312; --surface:#1b1b19; --surface-2:#232321; --ink:#ebe8e2; --muted:#aaa69e; --line:#34332f;
  --accent:#7ea6f8; --accent-soft:#272a2f; --accent-ink:#0d1526;
  --track:#141413; --best-bar:#cfcbc3; --home:#49e4fd; --draw:#77746d; --away:#d784a5; --home-ink:#0f2224; --away-ink:#2b1221; /* Heim/Gast eigene Töne, nicht der Akzent */
  --win:#22ae84; --loss:#e45e50; --tie:#5f5d58; --nav:#0e0e0d; --lime:#95cc62; --amber:#e6a94a;
  /* Flächen unter weißer Schrift (Form, Ergebnis, Stufen): je ≥ 4,5:1 */
  --win-fill:#3f8253; --loss-fill:#c83407; --tie-fill:#5f5d58;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:10px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f0efec; --surface:#ffffff; --surface-2:#f7f6f3; --ink:#1a1917; --muted:#5c5953; --line:#dcdad5;
    --accent:#2457c5; --accent-soft:#eceef2; --accent-ink:#ffffff;
    --track:#e7e5e0; --best-bar:#4a4742; --home:#0a758a; --draw:#77736c; --away:#7a1544; --home-ink:#ffffff; --away-ink:#ffffff;
    --win:#027d4e; --loss:#c21a16; --tie:#9e9a92; --nav:#e6e4df; --lime:#7cb342; --amber:#d98a1c;
    --win-fill:#3f8253; --loss-fill:#c83407; --tie-fill:#76726b;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f0efec; --surface:#ffffff; --surface-2:#f7f6f3; --ink:#1a1917; --muted:#5c5953; --line:#dcdad5;
  --accent:#2457c5; --accent-soft:#eceef2; --accent-ink:#ffffff;
  --track:#e7e5e0; --best-bar:#4a4742; --home:#0a758a; --draw:#77736c; --away:#7a1544; --home-ink:#ffffff; --away-ink:#ffffff;
  --win:#027d4e; --loss:#c21a16; --tie:#9e9a92; --nav:#e6e4df; --lime:#7cb342; --amber:#d98a1c;
    --win-fill:#3f8253; --loss-fill:#c83407; --tie-fill:#76726b;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fx:focus-visible,.tip:focus-visible,tbody tr:focus-visible{outline-offset:-2px}
::selection{background:color-mix(in srgb, var(--accent) 35%, transparent);color:var(--ink)}
body{caret-color:var(--accent)}
*{scrollbar-color:var(--line) transparent}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.shell{height:100%;display:flex;flex-direction:column}
.gutter{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* Kopfleiste: Band über die volle Breite, etwas dunkler als die Seite */
.topbar{flex:none;background:var(--nav);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.topbar-in{display:flex;align-items:stretch;gap:8px 36px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:32px;height:32px;flex:none}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:25px;letter-spacing:.02em;line-height:1;text-transform:uppercase}
.nav{display:flex;gap:6px;align-items:stretch}
.nav button{
  position:relative;display:inline-flex;align-items:center;gap:9px;padding:0 14px;border:0;
  background:transparent;cursor:pointer;font-weight:500;font-size:15px;color:var(--muted);
}
.nav button::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:transparent;transition:background .15s}
.nav button:hover{color:var(--ink)}
.nav button:hover::after{background:var(--line)}
.nav button[aria-pressed="true"]{color:var(--ink)}
.nav button[aria-pressed="true"]::after{background:var(--accent)}
.nav button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6}
.nav .count{font-family:var(--f-mono);font-size:11px;line-height:1;padding:3px 7px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.nav button[aria-pressed="true"] .count{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* Wettbewerbs-Picker in der Kopfleiste */
.cpick{position:relative;display:flex;align-items:center}
.cpick-btn{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-weight:500}
.cpick-btn:hover{border-color:var(--accent)}
.cpick-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8}
.cpick-btn .chev{width:12px;height:12px;transition:transform .15s}
.cpick-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.cpick-btn .count{font-family:var(--f-mono);font-size:11px;line-height:1;padding:3px 7px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.cpick-btn.filtered .count{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cpick-panel{position:absolute;top:calc(100% + 8px);left:0;z-index:20;width:320px;max-width:calc(100vw - 32px);max-height:min(70vh,520px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:10px 6px 8px}
.cpick-quick{display:flex;gap:4px;flex-wrap:wrap;padding:0 6px 8px;border-bottom:1px solid var(--line);margin-bottom:6px}
.cpick-quick button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer}
.cpick-quick button:hover{border-color:var(--accent);color:var(--accent)}
.cpick-note{margin:6px 8px 0;font-size:11px;color:var(--muted)}
.pk-tree,.pk-tree ul{list-style:none;margin:0;padding:0}
.pk-row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;align-items:center;gap:2px;padding:0 8px 0 2px;border-radius:6px}
.pk-row:hover{background:var(--surface-2)}
.pk-row label{display:flex;align-items:center;gap:8px;padding:7px 0;cursor:pointer;min-width:0}
.pk-row .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk-row .count{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.pk-all{border-bottom:1px solid var(--line);margin-bottom:4px;padding-bottom:4px}
.pk-all .name{font-weight:600}
.pk-country > .pk-row .name{font-weight:500}
.pk-leagues .pk-row{padding-left:24px}
.pk-tog{border:0;background:transparent;width:22px;height:22px;display:grid;place-items:center;border-radius:4px;cursor:pointer;color:var(--muted);padding:0}
.pk-tog svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.6;transition:transform .15s}
.pk-tog[aria-expanded="false"] svg{transform:rotate(-90deg)}
.pk-tree input[type="checkbox"]{accent-color:var(--accent);width:16px;height:16px;margin:0;flex:none;cursor:pointer}
.tag{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:color-mix(in srgb, var(--amber) 22%, var(--surface));color:var(--ink);flex:none}
.tag.lig{background:var(--surface-2);color:var(--muted)}
.pk-row.na{opacity:.6}
.pk-row.na label{cursor:not-allowed}
/* Date-Picker */
.dp-panel{width:332px}
.dp-presets{display:flex;flex-wrap:wrap;gap:4px;padding:0 6px 8px;border-bottom:1px solid var(--line);margin-bottom:8px}
.dp-presets button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer}
.dp-presets button:hover{border-color:var(--accent);color:var(--accent)}
.dp-presets button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dp-month{display:flex;align-items:center;justify-content:space-between;padding:0 6px 6px}
.dp-month b{font-family:var(--f-display);font-size:17px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.dp-nav{width:30px;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;font-size:16px;line-height:1}
.dp-nav:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.dp-nav:disabled{opacity:.35;cursor:default}
.dp-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px 0;padding:0 6px}
.dp-wd{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding:2px 0 4px}
.dp-day{height:40px;border:0;background:transparent;cursor:pointer;font-family:var(--f-mono);font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:6px}
.dp-day.has{color:var(--ink);font-weight:600}
.dp-day small{font-size:10px;font-weight:500;color:var(--accent);line-height:1}
.dp-day:hover{background:var(--surface-2)}
.dp-day.today{box-shadow:inset 0 0 0 1px var(--muted)}
.dp-day.in{background:color-mix(in srgb, var(--accent) 22%, var(--surface));border-radius:0}
.dp-day.start{border-radius:6px 0 0 6px} .dp-day.end{border-radius:0 6px 6px 0} .dp-day.start.end{border-radius:6px}
.dp-day.start,.dp-day.end{background:var(--accent);color:var(--accent-ink)}
.dp-day.start small,.dp-day.end small{color:var(--accent-ink)}
.dp-foot{display:flex;justify-content:space-between;gap:8px;margin-top:8px;padding:8px 8px 0;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.dp-foot span:last-child{white-space:nowrap;font-family:var(--f-mono)}
.dp-mode{display:flex;margin:0 6px 8px}
.dp-mode button{flex:1;white-space:nowrap}
.dp-day.pick{background:var(--accent);color:var(--accent-ink);border-radius:6px;box-shadow:inset 0 0 0 2px var(--surface)}
.dp-day.pick small{color:var(--accent-ink)}
.dp-link{border:0;background:none;padding:0;color:var(--accent);font:inherit;cursor:pointer;text-decoration:underline}
.range-nav{display:flex;gap:4px}
/* Predictions */
.pred-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--surface-2);position:relative;z-index:3}
.pdrop{position:relative;min-width:0}
.pred-bar .pdrop{margin-left:0}
.pdrop-panel .tag{margin-left:auto}
.pdrop-btn{gap:6px;padding:6px 10px;font-size:13px;max-width:100%}
.pdrop-k{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:500}
.pdrop-v{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px}
.pdrop-btn.filtered{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pred-bar .pdrop-panel{top:calc(100% + 6px);left:0;right:auto;width:300px;max-width:calc(100vw - 64px)}
.pd-opts{display:flex;flex-direction:column;gap:4px;padding:0 4px}
.pd-opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid transparent;border-radius:8px;background:transparent;padding:8px 10px;cursor:pointer}
.pd-opt:hover{background:var(--surface-2)}
.pd-opt[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pd-opt small{font-size:12px;color:var(--muted)}
.pp-range{display:grid;grid-template-columns:80px minmax(0,1fr);align-items:center;gap:8px 10px;padding:6px 10px 2px}
.pp-range label{font-size:12px;color:var(--muted)}
.pp-range output{font-family:var(--f-mono);color:var(--ink);font-weight:600}
.pp-range input{accent-color:var(--accent);width:100%}
.cpick-quick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pchips{display:flex;gap:6px;flex-wrap:wrap}
.pchips button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer}
.pchips button > span:last-child{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.pchips button:hover:not(:disabled){border-color:var(--accent)}
.pchips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pchips button[aria-pressed="true"] span{color:var(--accent-ink);border-color:transparent}
.pchips button:disabled{opacity:.45;cursor:default}
.tip-item{border-bottom:1px solid var(--line)}
.tip-item.on{background:color-mix(in srgb, var(--accent) 14%, var(--surface));box-shadow:inset 3px 0 0 var(--accent)}
.tip{display:grid;grid-template-columns:50px minmax(0,1.1fr) minmax(0,1.2fr) auto;align-items:center;gap:14px;width:100%;text-align:left;padding:10px 18px;border:0;background:transparent;cursor:pointer}
.tip:hover{background:color-mix(in srgb, var(--ink) 6%, var(--surface))}
.tip-item.on .tip:hover{background:transparent}
.tip-match{display:flex;flex-direction:column;gap:3px;min-width:0}
.tip-match small,.tip-pick small{font-size:11px;color:var(--muted)}
.tip-pick{display:flex;flex-direction:column;gap:2px;min-width:0}
.tip-pick b{font-size:14px}
.tip-au{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.tip-prob{display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:86px}
.tip-prob b{font-family:var(--f-mono);font-size:18px;font-weight:600}
.tip-prob small{font-size:11px;color:var(--muted)}
.tip-prob i{display:block;width:100%;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--lvl) var(--w),var(--line) var(--w))}
.tip-prob.hi,.tip-prob.mid,.tip-prob.low{--lvl:var(--accent)} /* keine Ampel: eine Chance ist keine Sicherheit */
.av{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;background:var(--c);color:#fff;font-size:10px;font-weight:700;flex:none}
.av.lg{width:42px;height:42px;font-size:15px}
.stars{color:var(--amber);letter-spacing:1px;font-size:12px}
.stars i{font-style:normal;color:var(--line)}
.pred-note{padding:12px 18px;margin:0}

/* Spiele nach Tagen */
.day-h{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:baseline;gap:8px;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 18px 8px;font-family:var(--f-display);font-size:16px;font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.day-h span{font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--muted);text-transform:none;letter-spacing:0}
.grp.sub{position:static}
.top-meta{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:500;color:var(--ink)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.cc{font-family:var(--f-mono);font-size:11px;line-height:1;padding:3px 4px;border:1px solid var(--line);border-radius:3px;color:var(--muted)}

/* Hauptbereich */
.main{flex:1;display:grid;grid-template-columns:minmax(0,var(--split,40%)) 16px minmax(0,1fr);gap:16px 0;min-height:0;min-width:0;padding-block:16px}
/* Trenner: ziehen, Pfeiltasten oder Doppelklick (zurück auf Start) */
.splitter{display:flex;justify-content:center;cursor:col-resize;touch-action:none}
.splitter::before{content:"";align-self:center;width:4px;height:44px;border-radius:2px;background:var(--line);transition:background .15s,height .15s}
.splitter:hover::before,.splitter.drag::before,.splitter:focus-visible::before{background:var(--accent);height:88px}
.splitter:focus-visible{outline:none}
body.resizing{cursor:col-resize;user-select:none}
body.resizing .panel{pointer-events:none}
/* Mittlere Breite: Marktchancen unter die Detailansicht */
@media (max-width:1280px){.main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,46%) minmax(0,1fr)}.splitter{display:none}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:0;min-width:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}
.panel-head h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:22px;letter-spacing:.01em;text-transform:uppercase;line-height:1.1}
.panel-body{overflow:auto;min-height:0;flex:1;scrollbar-gutter:stable} /* Platz für die Scrollleiste immer reservieren: kein Breitensprung */
.empty{padding:40px 24px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:20px;font-weight:600;text-transform:uppercase;margin-bottom:4px}

.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}

.crest{display:inline-block;width:18px;height:18px;border-radius:50%;flex:none;border:1px solid var(--line);
  background:linear-gradient(135deg,var(--c1) 0 52%,var(--c2) 52% 100%)}
.crest.lg{width:44px;height:44px;border-width:2px}

/* Spiele */
.grp{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:8px;background:var(--surface-2);border-bottom:1px solid var(--line);padding:7px 18px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em}
.grp .lg{color:var(--ink)}
.fx-item{border-bottom:1px solid var(--line)}
.fx{
  display:grid;grid-template-columns:50px minmax(0,1fr) 92px minmax(120px,190px);align-items:center;gap:14px;width:100%;
  text-align:left;padding:10px 18px;border:0;background:transparent;cursor:pointer;
}
.fx:hover{background:color-mix(in srgb, var(--ink) 6%, var(--surface))}
.fx-item.on{background:color-mix(in srgb, var(--accent) 14%, var(--surface));box-shadow:inset 3px 0 0 var(--accent)}
.fx-item.on .fx:hover{background:transparent}
.fx-more{display:flex;gap:8px;padding:0 18px 12px 82px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:6px;padding:5px 11px;font-size:13px;font-weight:500;cursor:pointer}
.btn:hover{background:var(--accent);color:var(--accent-ink)}
.btn svg,.back svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8}

/* Direkter Vergleich (H2H) */
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--accent);cursor:pointer;padding:2px 0;margin-bottom:4px;font-size:13px;font-weight:500}
/* Jeder H2H-Bereich ist eine eigene Karte auf abgesetztem Grund */
.h2h-wrap{display:flex;flex-direction:column;gap:14px;padding:16px;background:var(--bg);min-height:100%;box-sizing:border-box}
.h2h-sec{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;margin:0 -16px;padding:0 16px 12px;border-bottom:1px solid var(--line)}
.sec-t{margin:0;font-family:var(--f-display);font-size:19px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;line-height:1.1;display:flex;align-items:center;gap:8px}
.sec-t::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}
.sec-s{display:block;font-size:12px;color:var(--muted);margin-top:2px;padding-left:12px}
.cmp-names{display:flex;justify-content:space-between;font-size:12px;font-weight:600}
.cmp-names span{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.h{background:var(--home)} .dot.a{background:var(--away)}
.h2h-wrap > .note{margin:0;padding:0 4px}

/* Vor dem Spiel: Wetter + Trainer */
.prematch{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:14px}
.wx{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.wx-i{width:44px;height:44px;fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.wx > div{display:flex;flex-direction:column}
.wx-t{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1}
.wx > div span{font-size:13px;color:var(--muted)}
.wx-d{grid-column:1/-1;list-style:none;margin:6px 0 0;padding:8px 0 0;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px}
.wx-d li{display:flex;flex-direction:column;font-size:11px;color:var(--muted)}
.wx-d b{font-size:13px;color:var(--ink);font-weight:500}
.coaches{display:flex;flex-direction:column;gap:8px}
.coach{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.coach-b{display:flex;flex-direction:column;gap:2px;min-width:0}
.coach-b b{font-size:14px}
.coach-b small{font-size:12px;color:var(--muted)}
.flag{align-self:flex-start;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:color-mix(in srgb, var(--amber) 25%, var(--surface));color:var(--ink)}
/* Aufstellungen auf dem Platz + Ausfälle */
.lineups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.lu,.abs{display:flex;flex-direction:column;gap:8px;min-width:0}
.lu-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lu-h .tm{font-weight:600;min-width:0}
.lu-h .tm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lu-f{white-space:nowrap}
.lu-f{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.pitch{position:relative;display:flex;flex-direction:column-reverse;gap:0;padding:4px;border-radius:8px;border:1px solid var(--line);background:repeating-linear-gradient(0deg,color-mix(in srgb, var(--win) 9%, var(--surface)) 0 28px,color-mix(in srgb, var(--win) 14%, var(--surface)) 28px 56px)}
.pitch::before{content:"";position:absolute;left:30%;right:30%;bottom:0;height:34px;border:1px solid color-mix(in srgb, var(--ink) 18%, transparent);border-bottom:0}
.pitch::after{content:"";position:absolute;left:30%;right:30%;top:0;height:2px;background:color-mix(in srgb, var(--ink) 18%, transparent)}
.pl-row{position:relative;z-index:1;display:flex;justify-content:space-around;gap:2px}
/* feste Zonenhöhen: Linien stehen bei beiden Teams und jedem Spiel an derselben Stelle (Mittelfeld fasst 2 Reihen) */
.pl-zone{position:relative;z-index:1;display:flex;flex-direction:column-reverse;justify-content:center;gap:6px;height:84px;box-sizing:border-box;padding:16px 0 4px;border-top:1px dashed color-mix(in srgb, var(--ink) 30%, transparent)}
.pl-zone:last-child{border-top:0}
.pl-zone.z-MF{height:148px}
.pl-zone > em{position:absolute;left:6px;top:3px;font-style:normal;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:5px}
.rt{font-family:var(--f-mono);font-size:10px;font-weight:600;line-height:1;padding:2px 4px;border-radius:3px;letter-spacing:0}
.rt.hi{background:var(--win-fill);color:#fff} .rt.mid{background:var(--lime);color:#14260b} .rt.low{background:var(--amber);color:#2a1800} .rt.bad{background:var(--loss-fill);color:#fff}
.str{display:flex;flex-direction:column;gap:10px;margin-top:4px;padding-top:12px;border-top:1px solid var(--line)}
.str-h{font-size:13px;font-weight:600}
.str-h small{font-weight:400;color:var(--muted);margin-left:6px}
/* Hantel-Darstellung des Stärkevergleichs */
.db-legend{display:flex;gap:18px;font-size:13px;font-weight:600}
.db-legend span{display:inline-flex;align-items:center;gap:6px}
.db-legend .db-dot{position:static;margin:0}
.db{display:flex;flex-direction:column;gap:2px}
.db-row{display:grid;grid-template-columns:96px minmax(0,1fr) 84px;align-items:center;gap:12px;height:42px}
.db-row.total{height:48px;border-top:1px solid var(--line);margin-top:2px}
.db-l{font-size:13px;color:var(--muted)}
.db-row.total .db-l{color:var(--ink);font-weight:600}
.db-track{position:relative;height:28px;margin:0 34px}
.db-axis{position:absolute;left:0;right:0;top:13px;height:2px;background:var(--line)}
.db-link{position:absolute;top:12px;height:4px;border-radius:2px;background:color-mix(in srgb, var(--muted) 40%, var(--surface))}
.db-dot{position:absolute;top:7px;width:14px;height:14px;margin-left:-7px;border-radius:50%;box-sizing:border-box;display:inline-block}
.db-dot.h{background:var(--home)}
.db-dot.a{border:3px solid var(--away);background:var(--surface)}
.db-row.total .db-dot{top:5px;width:18px;height:18px;margin-left:-9px}
.db-row.total .db-dot.a{border-width:4px}
.db-row.total .db-link{top:11px;height:6px}
.db-v{position:absolute;top:4px;transform:translateX(12px);font-family:var(--f-mono);font-size:13px;font-weight:600;white-space:nowrap}
.db-v.l{transform:translateX(calc(-100% - 12px))}
.db-v.h{color:var(--home)} .db-v.a{color:var(--away)}
.db-row.total .db-v{font-size:15px;top:3px}
.db-d{justify-self:end;font-family:var(--f-mono);font-size:12px;padding:3px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.db-d.lead-h{color:var(--home)} .db-d.lead-a{color:var(--away)}
.db-row.total .db-d{font-weight:600}
.db-row.total .db-d.lead-h{background:var(--home);border-color:var(--home);color:var(--home-ink)}
.db-row.total .db-d.lead-a{background:var(--away);border-color:var(--away);color:var(--away-ink)}
.db-ticks{height:18px}
.db-ticks .db-track{height:16px}
.db-ticks .db-track span{position:absolute;transform:translateX(-50%);font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.pl{display:flex;flex-direction:column;align-items:center;gap:1px;width:62px;min-width:0;font-size:11px;line-height:1.15;text-align:center}
.pl i{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;font-style:normal;font-family:var(--f-mono);font-size:11px;font-weight:600;color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.pitch.h .pl i{background:var(--home);color:var(--home-ink)} .pitch.a .pl i{background:var(--away);color:var(--away-ink)}
.pl span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl.doubt i{box-shadow:0 0 0 2px var(--amber)}
.lu-legend{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.pl-dot{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--amber)}
.abs-r{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.abs-no{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:center}
.abs-r b{display:block;font-size:13px}
.abs-r small{font-size:11px;color:var(--muted)}
.abs-s{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right}
.st{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:4px}
.st.out{background:color-mix(in srgb, var(--loss) 20%, var(--surface));color:var(--loss)}
.st.doubt{background:color-mix(in srgb, var(--amber) 25%, var(--surface));color:var(--ink)}
@container (max-width:640px){
  .prematch,.lineups{grid-template-columns:minmax(0,1fr)}
}

/* Bilanz-Kopf: Team | Duelle + Balken | Team */
.hero{display:grid;grid-template-columns:120px minmax(0,1fr) 120px;grid-template-areas:"h m a";align-items:start;gap:0;padding-top:4px}
.hero-team{grid-area:h;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;min-width:0}
.hero-team.a{grid-area:a}
.hero-team b{font-size:15px;font-weight:600;margin-top:6px;max-width:100%;overflow-wrap:anywhere}
.hero-pct{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.crest-box{width:72px;height:72px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.crest-box .crest{width:44px;height:44px}
.hero-mid{grid-area:m;display:flex;flex-direction:column;align-items:stretch;gap:6px;min-width:0}
.hero-n{display:flex;flex-direction:column;align-items:center;line-height:1}
.hero-n b{font-family:var(--f-display);font-size:34px;font-weight:700}
.hero-n span{font-size:15px;color:var(--muted);margin-top:2px}
.hero-bar-row{display:grid;grid-template-columns:minmax(12px,1fr) minmax(0,8fr) minmax(12px,1fr);align-items:center}
.hero-line{height:1px;background:var(--muted);opacity:.6}
.hero-bar{display:flex;height:34px;border-radius:6px;overflow:hidden;gap:2px}
.hero-bar i{display:grid;place-items:center;font-style:normal;font-family:var(--f-mono);font-size:14px;font-weight:500;min-width:6px}
.hero-bar .sh{background:color-mix(in srgb, var(--home) 30%, var(--surface));color:var(--home)}
.hero-bar .sd{background:color-mix(in srgb, var(--draw) 40%, var(--surface));color:var(--ink)}
.hero-bar .sa{background:color-mix(in srgb, var(--away) 30%, var(--surface));color:var(--away)}
.hero-legend{display:flex;justify-content:space-between;padding:0 10%;font-size:14px;font-weight:600}
.hero-legend span:nth-child(2){color:var(--muted);font-weight:500}
.hero-text{margin:4px 0 0;font-size:14px;line-height:1.6;color:var(--muted);max-width:75ch}

/* Tabellenverlauf (H2H und Team-Details) */
.perf-ctrl{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap}
.perf-chart{width:100%;min-height:230px;overflow:hidden}
.pc{display:block;max-width:100%}
.pc-grid{stroke:var(--line);stroke-width:1}
.pc-axis{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.pc-zone-cl{fill:var(--accent);opacity:.09}
.pc-zone-down{fill:var(--loss);opacity:.09}
.pc-now{stroke:var(--muted);stroke-dasharray:3 3}
.pc-line{stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.pc-prev{stroke-width:1.75;stroke-dasharray:5 4;opacity:.55}
.pc-dot{fill:var(--surface);stroke-width:2}
.pc-end{font-family:var(--f-mono);font-size:12px;font-weight:600}
.perf-legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--muted)}
.perf-legend b{color:var(--ink);font-weight:600}
.sw{display:inline-block;width:18px;height:0;border-top:3px solid;vertical-align:middle;margin-right:6px;border-radius:2px}
.sw.dash{border-top-style:dashed;border-top-width:2px}

/* Anteils-Kacheln mit Farbbalken unten */
.rate-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.rate{border:1px solid var(--line);border-bottom:5px solid var(--lvl);border-radius:8px;padding:14px 16px 12px;background:var(--surface);display:flex;flex-direction:column;gap:4px;min-width:0}
.rate.hi{--lvl:var(--win)} .rate.mid{--lvl:var(--lime)} .rate.low{--lvl:var(--amber)} .rate.bad{--lvl:var(--loss)}
.rate-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.rate-top b{font-family:var(--f-display);font-size:28px;font-weight:600;line-height:1}
.rate-top span{font-size:15px}
.rate-sub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Teamanalyse: Sieg / Remis / Niederlage im Balken, Punkte-Box, nächste Spiele */
.hero-bar .rw{background:color-mix(in srgb, var(--win) 30%, var(--surface));color:var(--win)}
.hero-bar .rd{background:color-mix(in srgb, var(--tie) 40%, var(--surface));color:var(--ink)}
.hero-bar .rl{background:color-mix(in srgb, var(--loss) 28%, var(--surface));color:var(--loss)}
.pts-box{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.pts-box b{font-family:var(--f-display);font-size:30px;font-weight:700;margin:0}
.pts-box span{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.sec-h .form{flex:none}
/* Anstehende Spiele: Schwierigkeit 1–5 (grün bis rot) */
.fdr-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(54px,1fr));gap:6px}
.fdr{border:0;border-radius:6px;padding:7px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;font-family:var(--f-mono);line-height:1.2}
.fdr b{font-size:13px;font-weight:600}
.fdr span{font-size:11px;opacity:.8}
.fdr:hover{filter:brightness(1.08)}
.fdr-pill{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;font-family:var(--f-mono);font-size:12px;font-weight:600;font-style:normal}
.d1{background:var(--win-fill);color:#fff} .d2{background:var(--lime);color:#14260b} .d3{background:var(--tie);color:var(--ink)}
.d4{background:var(--amber);color:#2a1800} .d5{background:var(--loss-fill);color:#fff}
.fdr-legend{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.fdr-legend .fdr-pill{width:18px;height:18px;font-size:11px}
.fdr-legend span:last-child{margin-left:4px}
.up-head,.up-row{display:grid;grid-template-columns:100px minmax(0,1fr) 24px minmax(130px,1.2fr);align-items:center;gap:12px}
.up-head{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 6px}
.up-row{width:100%;text-align:left;padding:8px 6px;border:0;border-top:1px solid var(--line);background:transparent;cursor:pointer}
.up-row:hover{background:var(--surface-2)}
.up-row.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.up-opp{display:flex;flex-direction:column;gap:2px;min-width:0}
.up-opp small{font-size:11px;color:var(--muted)}
.up-bar .hero-bar{height:24px}
.up-bar .hero-bar i{font-size:11px}
.mk-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fx-pick select{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:260px}

/* Teamliste: Hinweis und Pfeil zum Öffnen */
.tbl-hint{margin:0;padding:10px 18px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
td.go{width:20px;padding-left:0;color:var(--muted)}
td.go svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;vertical-align:middle}
tbody tr:hover td.go,tbody tr:focus-visible td.go{color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.cmp{display:grid;grid-template-columns:52px minmax(0,1fr) 52px;align-items:center;gap:12px}
.cmp .v{font-family:var(--f-mono);font-size:14px;font-weight:500}
.cmp .v:last-child{text-align:right}
.cmp-mid{display:flex;flex-direction:column;gap:5px;text-align:center;font-size:12px;color:var(--muted)}
.cmp-bars{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.half{height:6px;border-radius:3px;background:var(--line);display:flex;overflow:hidden}
.half.l{justify-content:flex-end}
.half.l i{background:var(--home)} .half.r i{background:var(--away)}
.half i{display:block;height:100%;border-radius:3px}
.mt{display:grid;grid-template-columns:86px minmax(0,1fr) 56px minmax(0,1fr);align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.mt:last-child{border-bottom:0}
.mt-d{font-family:var(--f-mono);font-size:12px;line-height:1.25}
.mt-d small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted)}
.mt-h{text-align:right;justify-content:flex-end}
.mt .tm{gap:6px;font-weight:400}
.mt .tm.win{font-weight:600}
.res{font-family:var(--f-mono);font-weight:500;text-align:center;border-radius:4px;padding:3px 0;color:#fff}
.res.S{background:var(--win-fill)} .res.U{background:var(--tie-fill)} .res.N{background:var(--loss-fill)}
/* Torphasen-Heatmap */
.chk{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:500;align-self:flex-start}
.chk input{accent-color:var(--accent);width:16px;height:16px;margin:0;cursor:pointer}
.ph-block{display:flex;flex-direction:column;gap:6px}
.ph-head{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.ph-head b{font-family:var(--f-display);font-size:18px;font-weight:600;text-transform:uppercase}
.ph-head span{font-size:12px;color:var(--muted)}
.ph-row{display:grid;grid-template-columns:96px 26px repeat(6,minmax(0,1fr));gap:6px;align-items:center}
.ph-l{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.ph-blank{visibility:hidden}
.ph-t{font-family:var(--f-display);font-size:22px;font-weight:700;text-align:center;line-height:1}
.ph-t.sc{color:var(--win)} .ph-t.co{color:var(--loss)}
.ph-c{height:32px;border-radius:6px;display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.ph-c.sc{background:color-mix(in srgb, var(--win) var(--a), var(--surface));border-color:transparent;color:var(--ink);font-weight:600}
.ph-c.co{background:color-mix(in srgb, var(--loss) var(--a), var(--surface));border-color:transparent;color:var(--ink);font-weight:600}
.ph-c.hi{color:#fff}
.ph-axis > span{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.ph-sep{border:0;border-top:1px dashed var(--line);margin:6px 0;width:100%}
.formrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.formrow .tm{font-weight:500}
.note{font-size:12px;color:var(--muted)}
.fx-time{font-family:var(--f-mono);font-size:12px;color:var(--muted);line-height:1.3}
.fx-time b{display:block;font-weight:500;font-size:13px;color:var(--ink)}
.fx-teams{display:flex;flex-direction:column;gap:4px;min-width:0}
.tm{display:flex;align-items:center;gap:8px;min-width:0;font-weight:500}
.tm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx-xg{font-family:var(--f-mono);font-size:13px;text-align:center}
.fx-xg small{display:block;font-family:var(--f-body);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.split{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px}
.split i{display:block;height:100%}
.split .h{background:var(--home)} .split .d{background:var(--draw)} .split .a{background:var(--away)}
.split-pct{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:4px}
.split-pct em{font-style:normal;opacity:.75}
.split-pct > span{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.split-pct > span:nth-child(2){align-items:center}
.split-pct > span:last-child{align-items:flex-end}
.fx-q{min-width:0;font-size:11px;font-weight:400;padding:1px 5px}

const MD_TOTAL = {BL1:34, BL2:34, PL:38, LL:38, SA:38};
const posCache = {};
function posHistory(k){
  if (posCache[k]) return posCache[k];
  const row = rowOf(k), l = T[k].lg, n = TABLES[l].length, r = seeded(k + "-verlauf");
  const walk = (end, len) => {
    const a = new Array(len); a[len - 1] = end;
    for (let i = len - 2; i >= 0; i--){
      const vol = Math.max(1, Math.round(n / 9)) + (i < 4 ? 1 : 0);
      a[i] = Math.min(n, Math.max(1, a[i + 1] + Math.round((r() * 2 - 1) * vol)));
    }
    return a;
  };
  const cur = walk(row.pos, row.sp);
  const prevEnd = Math.min(n, Math.max(1, row.pos + Math.round((r() * 2 - 1) * Math.max(2, n / 5))));
  return posCache[k] = {cur, prev:walk(prevEnd, MD_TOTAL[l]), n, total:MD_TOTAL[l], played:row.sp};
}

function perfSvg(teams, W){
  // Zwei Teams: rechts Platz für „5. Leipzig“, damit die Linien nicht nur über die Farbe zu unterscheiden sind
  const H = 230, m = {l:30, r:teams.length > 1 ? 104 : 40, t:14, b:26}, hs = teams.map(posHistory), n = Math.max(...hs.map(h => h.n)), lg = LG[T[teams[0]].lg];
  const sameLeague = teams.every(k => T[k].lg === T[teams[0]].lg);
  const {from, to, played} = perfWindow(hs);
  const span = Math.max(1, to - from), pw = W - m.l - m.r, ph = H - m.t - m.b;
  const x = d => m.l + (to === from ? pw / 2 : (d - from) / span * pw);
  const y = p => m.t + (n === 1 ? ph / 2 : (p - 1) / (n - 1) * ph);
  const half = ph / Math.max(1, n - 1) / 2;
  let s = `<svg class="pc" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">`;
  if (PERF_ZONES && lg.full && sameLeague){ // Champions League (1–4) und Abstieg (letzte 2) als Bänder
    s += `<rect class="pc-zone-cl" x="${m.l}" y="${y(1) - half}" width="${pw}" height="${y(4) - y(1) + 2 * half}"/>`;
    s += `<rect class="pc-zone-down" x="${m.l}" y="${y(n - 1) - half}" width="${pw}" height="${y(n) - y(n - 1) + 2 * half}"/>`;
  }
  const ticks = n <= 8 ? Array.from({length:n}, (_, i) => i + 1) : [...new Set([1, ...Array.from({length:Math.floor(n / 5)}, (_, i) => (i + 1) * 5), n])];
  for (const t of ticks) s += `<line class="pc-grid" x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}"/><text class="pc-axis" x="${m.l - 8}" y="${y(t) + 4}" text-anchor="end">${t}</text>`;
  const xs = to - from + 1, step = xs > 20 ? 5 : xs > 10 ? 2 : 1;
  for (let d = from; d <= to; d++) if ((d - from) % step === 0 || d === to) s += `<text class="pc-axis" x="${x(d)}" y="${H - 6}" text-anchor="middle">${d}</text>`;
  if (to > played) s += `<line class="pc-now" x1="${x(played)}" x2="${x(played)}" y1="${m.t - 6}" y2="${H - m.b}"/><text class="pc-axis" x="${x(played) + 4}" y="${m.t - 2}">heute</text>`;
  const path = pts => pts.map((p, i) => `${i ? "L" : "M"}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join("");
  const r = xs > 15 ? 2.5 : 3.5, ends = [];
  teams.forEach((k, i) => {
    const h = hs[i], col = perfColor(teams, i), name = esc(short(k));
    if (S.perfPrev){
      const pp = []; for (let d = from; d <= to; d++) pp.push([d, h.prev[d - 1]]);
      s += `<path d="${path(pp)}" fill="none" style="stroke:${col}" class="pc-prev"/>`;
      s += pp.map(([d, p]) => `<circle cx="${x(d)}" cy="${y(p)}" r="${r * .7}" style="fill:${col}" opacity=".45"><title>${name} 25/26 · ${d}. Spieltag: Platz ${p}</title></circle>`).join("");
    }
    const cp = []; for (let d = from; d <= Math.min(to, h.played); d++) cp.push([d, h.cur[d - 1]]);
    s += `<path d="${path(cp)}" fill="none" style="stroke:${col}" class="pc-line"/>`;
    s += cp.map(([d, p], j) => j === cp.length - 1 ? "" : `<circle cx="${x(d)}" cy="${y(p)}" r="${r}" class="pc-dot" style="stroke:${col}"><title>${name} · ${d}. Spieltag: Platz ${p}</title></circle>`).join("");
    const [ld, lp] = cp[cp.length - 1];
    s += `<circle cx="${x(ld)}" cy="${y(lp)}" r="5.5" style="fill:${col}"><title>${name} · ${ld}. Spieltag: Platz ${lp}</title></circle>`;
    ends.push({x:x(ld) + 9, y:y(lp) + 4, t:teams.length > 1 ? `${lp}. ${name}` : lp + ".", col});
  });
  if (ends.length === 2 && Math.abs(ends[0].y - ends[1].y) < 13) ends[1].y = ends[0].y + 13; // Beschriftungen nicht übereinander
  s += ends.map(e => `<text class="pc-end" x="${e.x}" y="${e.y}" style="fill:${e.col}">${e.t}</text>`).join("");
  return s + `</svg>`;
}

// Spieler- und Trainernamen sind erfunden; alles mit festem Startwert, damit jede Ansicht dieselben Daten zeigt.
const FIRST = ["Lukas","Jonas","Mats","Niklas","Felix","Leon","Tim","Elias","Noah","Luca","Paul","Ben","Moritz","Jan","David","Marco","Samuel","Adrian","Tomás","Mateo","Hugo","Rafael","Kenan","Emil","Oskar","Milan","Arda","Ilias","Victor","Nico"];
const LAST = ["Brandt","Keller","Vogt","Hofmann","Lehmann","Albers","Seidel","Kramer","Busch","Winter","Roth","Haas","Beck","Frey","Lorenz","Novak","Moreau","Ricci","Santos","Jansen","Kovač","Lindqvist","Petit","Demir","Okafor","Varga","Morales","Costa","Berg","Falk"];
const POS_NAME = {TW:"Torwart", AB:"Abwehr", MF:"Mittelfeld", ST:"Sturm"};
const sqCache = {};
function squad(k){
  if (sqCache[k]) return sqCache[k];
  const r = seeded(k + "-kader"), names = new Set(), nums = new Set(), out = [];
  for (const [pos, n] of [["TW", 2], ["AB", 7], ["MF", 7], ["ST", 4]]) for (let i = 0; i < n; i++){
    let name, no;
    do { name = FIRST[Math.floor(r() * FIRST.length)][0] + ". " + LAST[Math.floor(r() * LAST.length)]; } while (names.has(name));
    do { no = pos === "TW" ? [1, 12, 21, 30][Math.floor(r() * 4)] : 2 + Math.floor(r() * 38); } while (nums.has(no));
    names.add(name); nums.add(no); out.push({name, pos, no});
  }
  return sqCache[k] = out;
}
const rtCache = {};
function rating(k, name){
  if (!rtCache[k]){
    const row = rowOf(k), base = 60 + 22 * (row.pts / row.sp / 3) - (T[k].lg === "BL2" ? 6 : 0), r = seeded(k + "-staerke");
    rtCache[k] = Object.fromEntries(squad(k).map(pl => [pl.name, Math.max(48, Math.min(93, Math.round(base + (pl.pos === "TW" ? 2 : 0) + r() * 16 - 8)))]));
  }
  return rtCache[k][name];
}
const rtClass = v => v >= 80 ? "hi" : v >= 72 ? "mid" : v >= 64 ? "low" : "bad";
const GROUPS = [["TW", "Torwart"], ["AB", "Abwehr"], ["MF", "Mittelfeld"], ["ST", "Sturm"]];

// Ausfälle: 0–3 Spieler je Team (nie der Stammtorwart)
const REASONS = [["Muskelfaserriss", "fällt aus", "ca. 3 Wochen"], ["Knieprobleme", "fraglich", "Entscheidung am Spieltag"], ["Sprunggelenk", "fällt aus", "nach der Länderspielpause"],
  ["Gelbsperre", "gesperrt", "nächstes Spiel"], ["Rotsperre", "gesperrt", "in 2 Spielen"], ["Erkältung", "fraglich", "Abschlusstraining abwarten"],
  ["Oberschenkel", "fällt aus", "ca. 2 Wochen"], ["Kreuzbandriss", "fällt aus", "Rückrunde"]];
const absCache = {};
function absences(k){
  if (absCache[k]) return absCache[k];
  const r = seeded(k + "-ausfall"), pool = squad(k).slice(1), n = Math.floor(r() * 4), out = [];
  for (let i = 0; i < n; i++){
    const pl = pool.splice(Math.floor(r() * pool.length), 1)[0], [why, status, back] = REASONS[Math.floor(r() * REASONS.length)];
    out.push({...pl, why, status, back});

  return absCache[k] = out;
}
// voraussichtliche Elf nach Formation; ausfallende und gesperrte Spieler fehlen, fragliche sind markiert
const FORMATIONS = ["4-2-3-1", "4-3-3", "3-4-2-1", "4-4-2", "3-5-2"];
function lineup(k){
  const r = seeded(k + "-elf"), form = FORMATIONS[Math.floor(r() * FORMATIONS.length)], parts = form.split("-").map(Number);
  const abs = absences(k), out = new Set(abs.filter(a => a.status !== "fraglich").map(a => a.name)), doubt = new Set(abs.filter(a => a.status === "fraglich").map(a => a.name));
  const avail = squad(k).filter(pl => !out.has(pl.name)).map(pl => ({...pl, doubt:doubt.has(pl.name), rt:rating(k, pl.name)}));
  const take = (pos, n) => { const got = []; for (const want of [pos, "MF", "AB", "ST"]) for (const pl of avail) if (got.length < n && pl.pos === want && !pl.used){ pl.used = true; got.push(pl); } return got; };
  const lines = [take("TW", 1), take("AB", parts[0]), ...parts.slice(1, -1).map(n => take("MF", n)), take("ST", parts[parts.length - 1])];
  // Zonen nach Platz in der Formation (nicht nach Stammposition des Spielers)
  const rows = {TW:[lines[0]], AB:[lines[1]], MF:lines.slice(2, -1), ST:[lines[lines.length - 1]]};
  const groups = GROUPS.map(([key, label]) => { const pls = rows[key].flat(); return {key, label, rows:rows[key], avg:pls.reduce((a, pl) => a + pl.rt, 0) / pls.length}; });
  return {form, lines, groups, avg:lines.flat().reduce((a, pl) => a + pl.rt, 0) / 11};
}
// Trainer: etwa jedes zehnte Team hat kürzlich gewechselt
const COACH_FIRST = ["Thomas","Markus","Andrea","Stefan","Jens","Pablo","Marco","Uwe","Daniel","Luis","Christian","Fabio","Holger","Sergio","Frank","Oliver"];
const COACH_LAST = ["Reinhardt","Kessler","Baumann","Ferri","Lindner","Navarro","Schäfer","Gallo","Wendt","Ortega","Brückner","Conti","Matthes","Ramos","Thiel","Engel"];
function coach(k){
  const r = seeded(k + "-trainer"), nm = () => COACH_FIRST[Math.floor(r() * COACH_FIRST.length)] + " " + COACH_LAST[Math.floor(r() * COACH_LAST.length)];
  const name = nm(), changed = r() < .1;
  const since = changed ? new Date(2026, 9, 21 - (6 + Math.floor(r() * 30))) : new Date(2026 - 1 - Math.floor(r() * 3), 6, 1);
  const games = teamLog(k).filter(m => m.d >= since), w = games.filter(m => m.res === "S").length, d = games.filter(m => m.res === "U").length;
  return {name, changed, since, prev:changed ? nm() : null, n:games.length, w, d, l:games.length - w - d, ppg:games.length ? (3 * w + d) / games.length : 0};
}
// Wetter zum Anstoß: Herbstwerte, in Spanien und Italien wärmer
const WX = [["Sonnig", "sun"], ["Leicht bewölkt", "partly"], ["Bewölkt", "cloud"], ["Regenschauer", "rain"], ["Regen", "rain"], ["Nebel", "fog"]];
function weather(f){
  const r = seeded(f.id + "-wetter"), south = ["ES", "IT"].includes(LG[T[f.h].lg].c), m = f.d.getMonth();
  const [cond, icon] = WX[Math.min(WX.length - 1, Math.floor(r() * (south ? 4 : 6)))];
  const temp = Math.round((m === 9 ? 11 : m === 10 ? 7 : 4) + (south ? 7 : 0) + r() * 6 - 3);
  const rain = icon === "rain" ? 60 + Math.floor(r() * 35) : icon === "cloud" || icon === "fog" ? 15 + Math.floor(r() * 25) : Math.floor(r() * 12);
  const wind = 5 + Math.floor(r() * 30);
  return {cond, icon, temp, rain, wind, light:f.d.getHours() >= 18, pitch:rain >= 60 ? "nass, rutschig" : temp <= 3 ? "kalt, hart" : "gut bespielbar"};
}

// Stärkevergleich als Hantel: beide Teams auf einer gemeinsamen Skala (45–95); die Verbindung zeigt den Vorsprung.
// Der niedrigere Wert steht links seines Punkts, der höhere rechts; Köln-artige Heimfarbe gefüllt, Gast als Ring.
function strengthDumbbell(h, a){
  const lh = lineup(h), la = lineup(a), x = v => Math.max(0, Math.min(100, (v - 45) * 2));
  const row = (label, vh, va, total) => {
    const H = Math.round(vh), A = Math.round(va), lo = Math.min(x(H), x(A)), hi = Math.max(x(H), x(A)), hLeft = H <= A;
    const lead = H === A ? "gleich" : `+${Math.abs(H - A)} ${H > A ? h : a}`;
    const val = (v, side, left) => `<span class="db-v ${side}${left ? " l" : ""}" style="left:${x(v)}%">${v}</span>`;
    return `<div class="db-row${total ? " total" : ""}">
      <span class="db-l">${label}</span>
      <div class="db-track" role="img" aria-label="${label}: ${esc(short(h))} ${H}, ${esc(short(a))} ${A}">
        <i class="db-axis"></i><i class="db-link" style="left:${lo}%;width:${hi - lo}%"></i>
        <i class="db-dot h" style="left:${x(H)}%"></i><i class="db-dot a" style="left:${x(A)}%"></i>
        ${val(H, "h", hLeft)}${val(A, "a", !hLeft)}
      </div>
      <span class="db-d${H === A ? "" : H > A ? " lead-h" : " lead-a"}">${lead}</span>
    </div>`;
  };
  return `<div class="str">
    <div class="str-h">Stärke im Vergleich <small>Ø Bewertung der Startelf, 0–100</small></div>
    <div class="db-legend"><span><i class="db-dot h"></i>${esc(short(h))}</span><span><i class="db-dot a"></i>${esc(short(a))}</span></div>
    <div class="db">
      ${lh.groups.map((g, i) => row(g.label, g.avg, la.groups[i].avg)).join("")}
      ${row("Gesamt", lh.avg, la.avg, true)}
      <div class="db-row db-ticks" aria-hidden="true"><span></span><div class="db-track">${[50, 60, 70, 80, 90].map(t => `<span style="left:${x(t)}%">${t}</span>`).join("")}</div><span></span></div>
    </div>
  </div>`;
}

// Torphasen-Blöcke (Heatmap); blocks: [{k, opp?, title?, games, note, sc, co}]
function phaseBlocks(blocks, unit){
  const max = Math.max(1, ...blocks.flatMap(b => [...b.sc, ...b.co]));
  const total = arr => arr.reduce((s, v) => s + v, 0);
  const cells = (arr, kind) => arr.map((v, i) => `<span class="ph-c${v ? " " + kind + (v / max > .5 ? " hi" : "") : ""}"${v ? ` style="--a:${Math.round(25 + 70 * v / max)}%"` : ""} title="${PHASES[i]}–${PHASES[i + 1]}: ${v} ${v === 1 ? "Tor" : "Tore"}">${v}</span>`).join("");
  const axis = `<div class="ph-row ph-axis" aria-hidden="true"><span></span><span></span>${[0,1,2,3,4,5].map(i => `<span><span>${PHASES[i]}</span>${i === 5 ? `<span>${PHASES[6]}</span>` : ""}</span>`).join("")}</div>`;
  return blocks.map(b => `
      <div class="ph-block">
        <div class="ph-head"><b>${b.title || esc(T[b.k].n)}</b><span>${b.games} ${b.games === 1 ? unit[0] : unit[1]} · ${b.note}</span></div>
        <div class="ph-row"><span class="ph-l">${crest(b.k)}erzielt</span><b class="ph-t sc">${total(b.sc)}</b>${cells(b.sc, "sc")}</div>

        ${axis}

}
// Torphasen als Kacheln (H2H): je Block ein Team; tones = Farbe je Block (h/a), „kassiert“ immer grau

  const max = Math.max(1, ...blocks.flatMap(b => [...b.sc, ...b.co]));
  const total = arr => arr.reduce((s, v) => s + v, 0);
  // Stärke 10-45 %: darüber sinkt der Kontrast der Zahl in der Zelle unter 4,5:1
  const cells = (arr, kind, what) => arr.map((v, i) => `<span class="ph-c${v ? " " + kind : ""}"${v ? ` style="--a:${Math.round(10 + 35 * v / max)}%"` : ""} title="${PHASES[i]}–${PHASES[i + 1]}: ${v} ${v === 1 ? "Tor" : "Tore"} ${what}">${v}</span>`).join("");

// Direkter Vergleich in der rechten Detailansicht für das gewählte Spiel
function renderH2H(){
  const f = currentFixture(), {h, a} = f, H = short(h), A = short(a);
  const all = h2hMeetings(f), ms = S.h2hVenue === "home" ? all.filter(m => m.home === h) : all, s = h2hStats(ms);
  const pctInt = v => s.n ? Math.round(v / s.n * 100) : 0;
  // „keine Siege“ statt „0 Siege“ (Prüfung vom 28.10.2026)
  const count = (v, c) => c === "d" ? (v ? `${v} Remis` : "kein Remis") : v ? `${v} ${v === 1 ? "Sieg" : "Siege"}` : "keine Siege";
  const sides = [[s.wH, "h"], [s.dr, "d"], [s.wA, "a"]];
  const avg = nf1.format((s.gH + s.gA) / (s.n || 1));
  const venueSeg = `<div class="seg" role="group" aria-label="Duelle filtern">
      <button data-venue="all" aria-pressed="${S.h2hVenue !== "home"}">Alle ${all.length}</button>
      <button data-venue="home" aria-pressed="${S.h2hVenue === "home"}">Nur in ${esc(H)}</button>
    </div>`;
  // Kernzeile wie „Am ehesten“ bei den Marktchancen: die Bilanz der Duelle in einer Zeile
  sideHead({eyebrow:"Direkter Vergleich", title:matchTitle(f), meta:matchMeta(f),

// Spiele der laufenden Saison: Ergebnisse passend zu Bilanz, Torverhältnis und Form der letzten 5
const logCache = {};
function teamLog(k){
  if (logCache[k]) return logCache[k];
  const r = seeded(k + "-spiele"), [w, d, l, gf, ga] = T[k].r, sp = w + d + l, form = [...T[k].f];
  const cnt = c => form.filter(x => x === c).length;
  let rw = Math.max(0, w - cnt("S")), rl = Math.max(0, l - cnt("N"));
  const early = [];
  while (early.length < sp - form.length){ if (rw){ early.push("S"); rw--; } else if (rl){ early.push("N"); rl--; } else early.push("U"); }
  for (let i = early.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [early[i], early[j]] = [early[j], early[i]]; }
  const res = [...early, ...form].slice(-sp);
  const g = res.map(x => x === "S" ? [1, 0] : x === "N" ? [0, 1] : [0, 0]);
  let rf = gf - g.reduce((s, x) => s + x[0], 0), ra = ga - g.reduce((s, x) => s + x[1], 0);
  for (let guard = 0; (rf > 0 || ra > 0) && guard < 3000; guard++){ // restliche Tore verteilen, ohne Ergebnisse zu kippen
    const i = Math.floor(r() * sp), x = res[i], m = g[i];
    if (x === "U"){ if (rf > 0 && ra > 0){ m[0]++; m[1]++; rf--; ra--; } }
    else if (rf > 0 && (x === "S" || m[0] + 1 < m[1])){ m[0]++; rf--; }
    else if (ra > 0 && (x === "N" || m[1] + 1 < m[0])){ m[1]++; ra--; }
  }
  const others = TABLES[T[k].lg].map(t => t.k).filter(o => o !== k);
  for (let i = others.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [others[i], others[j]] = [others[j], others[i]]; }
  const parity = r() < .5 ? 0 : 1, comp = LG[T[k].lg].n;
  return logCache[k] = res.map((x, i) => {
    const opp = others[i % others.length], home = i % 2 === parity, [my, op] = g[i];
    return {md:i + 1, d:new Date(2026, 9, 18 - (sp - 1 - i) * 7), comp, opp, isHome:home, my, op, res:x,
      home:home ? k : opp, away:home ? opp : k, hg:home ? my : op, ag:home ? op : my};
  });
}
// Spielwerte pro Spiel (Platzhalter, grob an Punkte und Tore des Teams angelehnt)
const metricCache = {};
function teamMetrics(k){
  if (metricCache[k]) return metricCache[k];
  const row = rowOf(k), s = row.pts / row.sp / 3, r = seeded(k + "-werte"), j = a => 1 + (r() * 2 - 1) * a;
  const shots = (9 + 9 * s) * j(.08);
  return metricCache[k] = {xg:row.gf / row.sp * j(.12), xga:row.ga / row.sp * j(.12), shots, sot:shots * (.3 + .12 * s),
    corners:(4 + 3 * s) * j(.1), poss:(42 + 18 * s) * j(.04), pass:(76 + 12 * s) * j(.02), cards:(2.6 - .9 * s) * j(.12)};
}
function leagueMetrics(lg){
  const ks = TABLES[lg].map(t => t.k), ms = ks.map(teamMetrics), avg = {};
  for (const key of Object.keys(ms[0])) avg[key] = ms.reduce((s, m) => s + m[key], 0) / ms.length;
  return avg;
}

// ===== Märkte ===============================================================
// Mock-Buchmacherquote: faire Quote (1 ÷ Wahrscheinlichkeit) abzüglich einer festen, je Ausgang leicht
// schwankenden Marge von 2–7 %. Schlüssel = Spiel + Markt-Ausgang, damit Kacheln und Predictions übereinstimmen.
function bookOdds(fid, okey, p){
  const r = seeded(fid + "|" + okey);
  return Math.min(99, Math.max(1.01, Math.round(1 / p * (.93 + r() * .05) * 100) / 100));
}
// Ausgänge einer Kachel; prefix + Index ergibt den Quoten-Schlüssel (z. B. "1x2:0" = Heimsieg).
// sides (h/d/a) färbt die Balken wie in der Spielliste: Heim Türkis, Remis Grau, Gast Rosé.
// Ohne Seite hebt sich der wahrscheinlichste Ausgang neutral ab - Blau bleibt der Bedienung vorbehalten.
function outcomes(list, prefix, fid, sides){
  const max = Math.max(...list.map(o => o[1]));
  return list.map(([l, p], i) => `
    <div class="oc${p === max && list.length > 1 ? " best" : ""}">
      <span class="oc-l" title="${esc(l)}">${esc(l)}</span><span class="oc-p">${pct(p)}</span><span class="oc-o" title="Buchmacherquote (Mock)"><span class="sr">Quote </span>${nf2.format(bookOdds(fid, prefix + ":" + i, p))}</span>
      <span class="oc-bar"><i${sides ? ` class="${sides[i]}"` : ""} style="width:${(p * 100).toFixed(1)}%"></i></span>
    </div>`).join("");
}
const HXA = ["h", "d", "a"];
const tile = (title, sub, body, foot = "", wide = false) =>
  `<article class="tile${wide ? " wide" : ""}"><div class="tile-h"><h4>${title}</h4><span>${sub}</span></div>${body}${foot ? `<div class="tile-foot">${foot}</div>` : ""}</article>`;
const tileGroup = (title, tiles) => `<section class="tgroup"><h3 class="tgroup-h">${title}</h3><div class="tiles">${tiles.join("")}</div></section>`;

function renderMarkets(){
  const f = currentFixture();
  document.getElementById("tiles-wrap").className = "tiles-wrap";
  if (!f){
    sideHead({eyebrow:"Marktchancen", title:"Kein Spiel gewählt"});
    document.getElementById("tiles-wrap").innerHTML = emptyState("Keine Marktchancen", "Wähle eine Liga und ein Spiel, dann erscheinen hier die Chancen je Markt.");
    return;
  }
  const {h, a} = f, p = mock(f), H = short(h), A = short(a), l = LG[f.lg];
  const lineFmt = v => nf1.format(v);
  const overAt = line => p.dist.reduce((s, v, n) => n > line ? s + v : s, 0);
  const over = overAt(S.ou);
  // „Am ehesten“ (Davids Entscheidung 27.10.2026): der wahrscheinlichste Ausgang aus Endergebnis, Über/Unter 2,5 und
  // Beide treffen - dieselben Märkte wie bei den Predictions, keine eigene Rechnung. Fest 2,5, unabhängig von der gewählten Linie.
  const top = list => list.reduce((b, x) => x[1] > b[1] ? x : b);
  const o25 = overAt(2.5);
  const likely = [
    top([[H + " gewinnt", p.home], ["Unentschieden", p.draw], [A + " gewinnt", p.away]]),
    o25 >= .5 ? ["Über 2,5 Tore", o25] : ["Unter 2,5 Tore", 1 - o25],
    p.btts >= .5 ? ["Beide treffen", p.btts] : ["Nicht beide treffen", 1 - p.btts],
  ];
  sideHead({eyebrow:S.view === "teams" ? "Marktchancen · Spiel von " + esc(short(S.team)) : "Marktchancen", title:matchTitle(f),
    meta:matchMeta(f) + `<span>Erwartete Tore <b>${nf1.format(p.lh)} : ${nf1.format(p.la)}</b></span><span>Quoten: Buchmacher (Mock)</span>`,
    tools:S.view === "teams" ? teamFxSelect(f) : "",
    lead:`<b>Am ehesten</b>${likely.map(([t, v]) => `<span><strong>${esc(t)}</strong> <span class="num">${pct(v)}</span></span>`).join("")}`});

  const dMax = Math.max(...p.dist);
  // Gesamttore zeigt die gewählte Torlinie: Spalten darüber sind markiert, darunter stehen die Knöpfe der Linie.
  const cutAt = Math.ceil(S.ou); // erste Spalte über der Linie: dort steht der gestrichelte Trenner mit dem Wert der Linie
  const distHtml = `<div class="dist" aria-label="Torlinie ${lineFmt(S.ou)}: Spalten rechts der gestrichelten Linie zählen für Über">${p.dist.map((v, n) => `<div class="col${v === dMax ? " best" : ""}${n === cutAt ? ' cut" data-line="' + lineFmt(S.ou) : ""}"><span class="v">${Math.round(v * 100)}</span><span class="bar" style="height:${(v / dMax * 82).toFixed(1)}%"></span></div>`).join("")}</div>
    <div class="dist-x">${["0","1","2","3","4","5","6+"].map((x, n) => `<span${n > S.ou ? ' class="over"' : ""}>${x}</span>`).join("")}</div>`;
  const ouChips = `<div class="chips" role="group" aria-label="Torlinie für Über / Unter">${[0.5,1.5,2.5,3.5,4.5].map(v => `<button data-ou="${v}" aria-pressed="${v === S.ou}">${lineFmt(v)}</button>`).join("")}</div>`;

  document.getElementById("tiles-wrap").innerHTML = [
    tileGroup("Wer gewinnt", [
      tile("Endergebnis", "1X2 · 90 Min.", outcomes([[H + " (1)", p.home], ["Remis (X)", p.draw], [A + " (2)", p.away]], "1x2", f.id, HXA), "", true),
      tile("1. Halbzeit", "Stand zur Pause", outcomes([[H, p.ht[0]], ["Remis", p.ht[1]], [A, p.ht[2]]], "ht", f.id, HXA)),
      tile("Erstes Tor", "wer trifft zuerst", outcomes([[H, p.first[0]], ["Kein Tor", p.first[1]], [A, p.first[2]]], "first", f.id, HXA)),
    ]),
    tileGroup("Wie viele Tore", [
      tile("Gesamttore", "Verteilung in % · rechts der Linie: Über", distHtml + ouChips, "Erwartet <b>" + nf1.format(p.lh + p.la) + "</b> Tore", true),
      tile("Über / Unter", "Tore gesamt · Linie " + lineFmt(S.ou), outcomes([["Über " + lineFmt(S.ou), over], ["Unter " + lineFmt(S.ou), 1 - over]], "ou" + S.ou, f.id)),
      tile("Beide treffen", "BTTS · beide Teams treffen", outcomes([["Ja", p.btts], ["Nein", 1 - p.btts]], "btts", f.id)),
    ]),
    `<details class="more" id="more-mk"${S.moreOpen ? " open" : ""}><summary>Weitere Märkte <span>Doppelte Chance, exakte Ergebnisse</span></summary><div class="tiles">${[
      tile("Doppelte Chance", "zwei von drei", outcomes([[H + " oder Remis (1X)", p.home + p.draw], ["Kein Remis (12)", p.home + p.away], [A + " oder Remis (X2)", p.draw + p.away]], "dc", f.id)),
      tile("Exakte Ergebnisse", "Top 4", outcomes(p.cs.map(([sc, v]) => [sc.replace(":", " : "), v]), "cs", f.id)),
    ].join("")}</div></details>`,
  ].join("") + `
  <p class="note tiles-note">Chancen sind Schätzungen des Modells, die Quoten stammen vom Buchmacher und ändern keinen Tipp. Auch wahrscheinliche Ausgänge treten oft nicht ein – rechne nicht mit Gewinn.</p>`;
}

  if (refocus) document.querySelector(refocus)?.focus({preventScroll:true});

    document.getElementById(pk.id)?.focus();
    return;
  }
  if (e.target.id === "team-fx"){ S.teamFx = e.target.value; render(); document.getElementById("team-fx")?.focus(); return; }
  if (e.target.id !== "ph-split" && e.target.id !== "perf-prev") return;
  if (e.target.id === "ph-split") S.phSplit = e.target.checked; else S.perfPrev = e.target.checked;
  const id = e.target.id;
  const keep = body().scrollTop; render(); body().scrollTop = keep;
  document.getElementById(id)?.focus();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !document.getElementById("cpick-panel").hidden){ setPicker(false); document.getElementById("cpick-btn").focus(); return; }
  if (e.key === "Escape" && openDrop){ const id = openDrop; openDrop = null; render(); document.getElementById(id + "-btn")?.focus(); return; }
  if (e.key === "Escape" && !document.getElementById("dpick-panel").hidden){ setDate(false); document.getElementById("dpick-btn").focus(); return; }
  const tr = e.target.closest && e.target.closest("tr[data-team]");
  if (tr && (e.key === "Enter" || e.key === " ")){
    e.preventDefault(); S.team = tr.dataset.team; selectTeam();
  }
});
// Verlaufs-Charts bei Größenänderung des Fensters neu zeichnen (nur wenn sich die Breite ändert)
window.addEventListener("resize", drawPerfCharts);
// ===== Spaltenbreite: Trenner ziehen, Pfeiltasten, Doppelklick =================
const SPLIT = {min:.25, max:.65, def:.4};
const mainEl = document.querySelector(".main"), splitter = document.getElementById("splitter");
function applySplit(){
  S.split = Math.min(SPLIT.max, Math.max(SPLIT.min, +S.split || SPLIT.def));
  mainEl.style.setProperty("--split", (S.split * 100).toFixed(2) + "%");
  splitter.setAttribute("aria-valuenow", Math.round(S.split * 100));
  splitter.setAttribute("aria-valuetext", `Liste ${Math.round(S.split * 100)} % der Breite`);
}
// Anteil der linken Spalte an der Inhaltsbreite (Prozentwerte im Grid beziehen sich darauf)
function splitAt(clientX){
  const r = mainEl.getBoundingClientRect(), cs = getComputedStyle(mainEl);
  const left = r.left + parseFloat(cs.paddingLeft), width = mainEl.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  return (clientX - left - 8) / width; // 8 = halbe Trennerbreite
}
splitter.addEventListener("pointerdown", e => {
  e.preventDefault(); splitter.setPointerCapture(e.pointerId);
  splitter.classList.add("drag"); document.body.classList.add("resizing");
});
splitter.addEventListener("pointermove", e => {
  if (!splitter.hasPointerCapture(e.pointerId)) return;
  S.split = splitAt(e.clientX); applySplit();
});
const endDrag = e => {
  if (!splitter.classList.contains("drag")) return;
  splitter.classList.remove("drag"); document.body.classList.remove("resizing");
  if (splitter.hasPointerCapture(e.pointerId)) splitter.releasePointerCapture(e.pointerId);
  save();
};
splitter.addEventListener("pointerup", endDrag);
splitter.addEventListener("pointercancel", endDrag);
splitter.addEventListener("dblclick", () => { S.split = SPLIT.def; applySplit(); save(); });
splitter.addEventListener("keydown", e => {
  const step = e.shiftKey ? .05 : .02, keys = {ArrowLeft:-step, ArrowRight:step};
  if (e.key in keys) S.split += keys[e.key];
  else if (e.key === "Home") S.split = SPLIT.min;
  else if (e.key === "End") S.split = SPLIT.max;
  else if (e.key === "Enter") S.split = SPLIT.def;
  else return;
  e.preventDefault(); applySplit(); save();
});
applySplit();
render();
</script>

</body></html>
